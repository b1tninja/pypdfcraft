name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    defaults:
      run:
        working-directory: pypdfcraft
    steps:
      - uses: actions/checkout@v4
        with:
          path: pypdfcraft
      - uses: actions/checkout@v4
        with:
          repository: storytold/pdfcraft
          ref: ${{ vars.PDFCRAFT_REF || 'main' }}
          path: pdfcraft
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: pypdfcraft
          target: ${{ matrix.target }}
          manylinux: "2_28"
          maturin-version: v1.15.0
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --locked --out dist --compatibility pypi -i python3.12
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: pypdfcraft/dist

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pypdfcraft
    steps:
      - uses: actions/checkout@v4
        with:
          path: pypdfcraft
      - uses: actions/checkout@v4
        with:
          repository: storytold/pdfcraft
          ref: ${{ vars.PDFCRAFT_REF || 'main' }}
          path: pdfcraft
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: pypdfcraft
          target: x64
          maturin-version: v1.15.0
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --locked --out dist --compatibility pypi -i python3.12
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: pypdfcraft/dist

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pypdfcraft
    steps:
      - uses: actions/checkout@v4
        with:
          path: pypdfcraft
      - uses: actions/checkout@v4
        with:
          repository: storytold/pdfcraft
          ref: ${{ vars.PDFCRAFT_REF || 'main' }}
          path: pdfcraft
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: pypdfcraft
          target: aarch64
          maturin-version: v1.15.0
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --locked --out dist --compatibility pypi -i python3.12
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: pypdfcraft/dist

  sdist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypdfcraft
    steps:
      - uses: actions/checkout@v4
        with:
          path: pypdfcraft
      - uses: actions/checkout@v4
        with:
          repository: storytold/pdfcraft
          ref: ${{ vars.PDFCRAFT_REF || 'main' }}
          path: pdfcraft
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: pypdfcraft
          command: sdist
          maturin-version: v1.15.0
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: pypdfcraft/dist

  test-wheel:
    needs: [linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypdfcraft
    steps:
      - uses: actions/checkout@v4
        with:
          path: pypdfcraft
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: pypdfcraft/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test wheel
        run: |
          pip install uv pytest
          uv pip install pypdfcraft --no-index --find-links dist --reinstall
          pytest

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos, sdist, test-wheel]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "wheels-*/*"
      - uses: astral-sh/setup-uv@v5
      - run: uv publish --trusted-publishing always 'wheels-*/*'
